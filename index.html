<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Portal</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="site-header">
    <img src="assets/logo.png" alt="Washington Preparatory School logo" class="logo">
    <h1>Club Portal</h1>
  </header>

  <nav class="tabs">
    <a href="#members" class="tab" data-tab="members">Members</a>
    <a href="#projects" class="tab" data-tab="projects">Projects</a>
  </nav>

  <main>
    <section id="members" class="panel">
      <h2>Members</h2>
      <div id="members-table">Loading…</div>
    </section>

    <section id="projects" class="panel">
      <h2>Projects</h2>
      <div id="projects-table">Loading…</div>

      <div class="legend">
        <span class="badge status-planning">Planning</span>
        <span class="badge status-in-progress">In Progress</span>
        <span class="badge status-on-hold">On Hold</span>
        <span class="badge status-done">Done</span>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    Want to update something? See the <a href="https://github.com/the-official-armin/club-portal#readme">how-to guides</a>.
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
